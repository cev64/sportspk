name: Release

# Every push to main (i.e. every merged PR) publishes a signed APK as the latest GitHub Release.
# On the phone, this link always downloads the newest build:
#   https://github.com/cev64/sportspk/releases/latest/download/sportspk.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify signing secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Fail loudly rather than ship an unsigned or differently-signed APK, which could not
          # install over the existing app. Never echo the values themselves.
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret ${name}. See README.md > Releases."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Reconstruct release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          # versionCode must only ever increase; the run number does, and the offset keeps it
          # above any build made before this workflow existed.
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME=$(sed -n 's/^val versionNameValue = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Building ${VERSION_NAME} (${VERSION_CODE})"

      - name: Unit tests and signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease -PversionCode="${VERSION_CODE}" --stacktrace

      - name: Verify the APK signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}"
          # Public certificate fingerprint (not a secret): a change here means updates would break.
          "${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}" | grep -i "SHA-256 digest" || true
          # A fixed asset name gives the phone a permanent "latest" download link.
          cp "${APK}" sportspk.apk

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          name: Sportspk ${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: "true"
          files: sportspk.apk
